[project]
name = "aws-check-codepipeline-deployed-stacks"
version = "0.1.0"
description = "Find AWS CloudFormation-stacks which are not deployed by CodePipline"
authors = [
    {name = "perfide",email = "perfide+github@zaubberer.net"},
]
license = {text = "BSD-2-Clause"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "boto3 (>=1.9.253,<2.0.0)",
]


[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true

[dependency-groups]
dev = []
